eszanka oleju z sadz\u0105 w intercoolerach i przewodach dolotu."},{co:"Brud eksploatacyjny",opis:"Zabrudzenia zewn\u0119trzne przed regeneracj\u0105, malowaniem lub sprzeda\u017C\u0105 cz\u0119\u015Bci."}],sens:["Kolektor ss\u0105cy zar\xF3s\u0142 nagarem i silnik traci moc","Zaw\xF3r EGR si\u0119 zacina lub ch\u0142odnica EGR jest zapchana","Intercooler jest zalany olejem po awarii turbospr\u0119\u017Carki"],bezSensu:["Cz\u0119\u015B\u0107 jest p\u0119kni\u0119ta lub skorodowana na wylot. Mycie nie zast\u0105pi naprawy"],faq:[{q:"Jakie cz\u0119\u015Bci przyjmujecie do mycia?",a:"Kolektory, EGR, intercoolery, przepustnice i inne metalowe elementy osprz\u0119tu silnika. Je\u015Bli nie wiesz, czy dana cz\u0119\u015B\u0107 si\u0119 nada, zadzwo\u0144."},{q:"Czy mycie ci\u015Bnieniowe mo\u017Ce uszkodzi\u0107 cz\u0119\u015B\u0107?",a:"Dobieramy ci\u015Bnienie i \u015Brodek do materia\u0142u. Elementy z elektronik\u0105 (np. si\u0142owniki) zdejmujemy lub zabezpieczamy przed myciem."}]}],hd=[{segment:"Samochody osobowe",opis:"DPF / FAP, SCR, tak\u017Ce z katalizatorem DOC",cena:399,uwaga:`kurier w obie strony ${z.kurier} z\u0142`},{segment:"Samochody dostawcze i busy",opis:"do 3,5 t",cena:449,uwaga:`kurier w obie strony ${z.kurier} z\u0142`},{segment:"Ci\u0119\u017Carowe i autobusy",opis:"DPF lub SCR",cena:899,uwaga:"zestawy DPF+SCR Euro 6 od 1 690 z\u0142; transport wyceniany przed wysy\u0142k\u0105"},{segment:"Maszyny rolnicze i budowlane",opis:"ci\u0105gniki, koparki, \u0142adowarki",cena:599,uwaga:"transport wyceniany przed wysy\u0142k\u0105"},{segment:"Katalizatory",opis:"osobny katalizator DOC lub benzynowy",cena:349,uwaga:`kurier w obie strony ${z.kurier} z\u0142`},{segment:"Kolektory i cz\u0119\u015Bci",opis:"mycie ci\u015Bnieniowe",cena:99,uwaga:`kurier w obie strony ${z.kurier} z\u0142`}],Pn=["Badanie przeciwci\u015Bnienia przed i po, z wydrukiem","Ogl\u0119dziny wk\u0142adu przed czyszczeniem","Zdj\u0119cie raportu SMS-em, zanim filtr wr\xF3ci","Faktura VAT",`Gwarancja ${z.gwarancja}`],Yi={punkty:[{t:"24 miesi\u0105ce bez limitu kilometr\xF3w",d:"Liczymy od dnia, w kt\xF3rym filtr do Ciebie wraca. Przebieg nie ma znaczenia."},{t:"Filtr znowu si\u0119 zapcha\u0142?",d:"Je\u015Bli w tym czasie filtr straci dro\u017Cno\u015B\u0107, wyczy\u015Bcimy go za darmo."},{t:"Kiedy gwarancja nie obejmuje filtra",d:"Gdy zapcha go usterka auta: wtryski, turbo, zaw\xF3r EGR albo du\u017Ce zu\u017Cycie oleju. Dlatego przed czyszczeniem pytamy o objawy."}],wylaczenia:["Niesprawne wtryskiwacze lub nieszczelne ko\u0144c\xF3wki wtrysku","Turbospr\u0119\u017Carka podaj\u0105ca olej do uk\u0142adu wydechowego","Niesprawny zaw\xF3r lub ch\u0142odnica EGR","Nadmierne zu\u017Cycie oleju silnikowego","Mechaniczne uszkodzenie wk\u0142adu po monta\u017Cu","Ingerencja w oprogramowanie sterownika dotycz\u0105ce DPF"]},bl=[{q:"Ile trwa czyszczenie filtra DPF?",a:`Sam proces w warsztacie zajmuje ${z.czasRealizacji}. Przy wysy\u0142ce kurierem doliczamy czas transportu w obie strony, zwykle po jednym dniu.`},{q:"Czy czyszczenie jest tak samo skuteczne jak nowy filtr?",a:"Je\u015Bli wk\u0142ad ceramiczny jest ca\u0142y, przeciwci\u015Bnienie po czyszczeniu wraca do warto\u015Bci zbli\u017Conych do nowego filtra. Potwierdza to wydruk z badania po czyszczeniu."},{q:"Jak zapakowa\u0107 filtr do wysy\u0142ki?",a:"Zatkaj wlot i wylot foli\u0105, owi\u0144 filtr foli\u0105 b\u0105belkow\u0105 i w\u0142\xF3\u017C do kartonu wype\u0142nionego tak, \u017Ceby si\u0119 nie przesuwa\u0142. Instrukcj\u0119 ze zdj\u0119ciami znajdziesz na stronie Jak to dzia\u0142a."},{q:"Co je\u015Bli filtra nie da si\u0119 wyczy\u015Bci\u0107?",a:"Badamy filtr przed czyszczeniem. Je\u015Bli wk\u0142ad jest p\u0119kni\u0119ty lub stopiony, dzwonimy z informacj\u0105, zanim cokolwiek zrobimy. Nie p\u0142acisz wtedy nic, a filtr odsy\u0142amy na nasz koszt."},{q:"Czy wystawiacie faktur\u0119 VAT?",a:"Tak, faktura jest w cenie us\u0142ugi. Dane do faktury podajesz przy zam\xF3wieniu odbioru."},{q:"Czy usuwacie lub wycinacie filtry DPF?",a:"Nie. Usuni\u0119cie DPF jest niezgodne z przepisami i ko\u0144czy si\u0119 problemami na przegl\u0105dzie. Zajmujemy si\u0119 wy\u0142\u0105cznie czyszczeniem."}],Ke=[{slug:"czyszczenie-dpf-zgorzelec",nazwa:"Zgorzelec",wMiescie:"w Zgorzelcu",zMiasta:"ze Zgorzelca",km:27,min:25,trasa:"drog\u0105 krajow\u0105 nr 30",lokalnie:"Zgorzelec to miasto przy przej\u015Bciu granicznym z G\xF6rlitz i autostradzie A4. Du\u017Co tu bus\xF3w, aut dostawczych i ci\u0119\u017Car\xF3wek, kt\xF3re je\u017Cd\u017C\u0105 g\u0142\xF3wnie tras\u0105, a w mie\u015Bcie stoj\u0105 w korkach przy mo\u015Bcie. To mieszanka, kt\xF3ra szybko zapycha DPF: d\u0142ugie odcinki na autostradzie przerywane jazd\u0105 stop-start przy odprawie i dostawach.",dla:"Firmom transportowym i kurierskim ze Zgorzelca proponujemy sta\u0142y odbi\xF3r filtr\xF3w i rozliczenie zbiorcze.",faq:[{q:"Czy odbieracie filtry ze Zgorzelca?",a:`Tak, kurierem, ${z.kurier} z\u0142 w obie strony. Mo\u017Cesz te\u017C podjecha\u0107 do nas do Lubania, to oko\u0142o 25 minut.`},{q:"Czy obs\u0142ugujecie klient\xF3w z G\xF6rlitz?",a:"Tak, przyjmujemy filtry od klient\xF3w z Niemiec. Kontakt na razie po polsku, faktur\u0119 wystawiamy tak\u017Ce na firm\u0119 z UE."}]},{slug:"czyszczenie-dpf-boleslawiec",nazwa:"Boles\u0142awiec",wMiescie:"w Boles\u0142awcu",zMiasta:"z Boles\u0142awca",km:43,min:40,trasa:"przez Nowogrodziec",lokalnie:"Boles\u0142awiec le\u017Cy przy w\u0119\u017Ale A4 i A18, wi\u0119c przez miasto przeje\u017Cd\u017Ca du\u017Co transportu ci\u0119\u017Carowego i flot firmowych. W okolicy pracuj\u0105 te\u017C zak\u0142ady i gospodarstwa z maszynami Euro 5 i Euro 6, gdzie zapchany DPF oznacza przest\xF3j w \u015Brodku sezonu.",dla:"Dla firm z Boles\u0142awca i Nowogrod\u017Aca ustalamy sta\u0142y dzie\u0144 odbioru, a dla maszyn wycen\u0119 z g\xF3ry przed wysy\u0142k\u0105.",faq:[{q:"Ile jedzie si\u0119 z Boles\u0142awca do Lubania?",a:`Oko\u0142o 40 minut, przez Nowogrodziec. Filtr mo\u017Cna te\u017C wys\u0142a\u0107 kurierem, ${z.kurier} z\u0142 w obie strony.`},{q:"Czy czy\u015Bcicie filtry z ci\u0119\u017Car\xF3wek z Boles\u0142awca?",a:"Tak, tak\u017Ce zestawy DPF+SCR Euro 6. Przy du\u017Cych zestawach zadzwo\u0144 przed wysy\u0142k\u0105, ustalimy odbi\xF3r."}]},{slug:"czyszczenie-dpf-lesna",nazwa:"Le\u015Bna",wMiescie:"w Le\u015Bnej",zMiasta:"z Le\u015Bnej",km:11,min:15,trasa:"",lokalnie:"Z Le\u015Bnej do nas jest kilkana\u015Bcie minut, wi\u0119c najwygodniej przywie\u017A\u0107 filtr osobi\u015Bcie. Wok\xF3\u0142 Le\u015Bnej i Jeziora Z\u0142otnickiego dominuj\u0105 kr\xF3tkie trasy i rolnictwo. Kr\xF3tkie przejazdy nie pozwalaj\u0105 filtrowi si\u0119 wypali\u0107, a ci\u0105gniki i \u0142adowarki pracuj\u0105 d\u0142ugo na niskich obrotach.",dla:"Rolnikom z gminy Le\u015Bna oferujemy czyszczenie filtr\xF3w z ci\u0105gnik\xF3w i maszyn z odbiorem osobistym w Lubaniu.",faq:[{q:"Czy mog\u0119 przywie\u017A\u0107 filtr osobi\u015Bcie z Le\u015Bnej?",a:"Tak, to kilkana\u015Bcie minut drogi. Zadzwo\u0144 wcze\u015Bniej, \u017Ceby\u015Bmy mogli od razu przyj\u0105\u0107 filtr na maszyn\u0119."},{q:"Czy czy\u015Bcicie filtry z ci\u0105gnik\xF3w?",a:"Tak, filtry DPF i katalizatory z maszyn rolniczych i budowlanych."}]},{slug:"czyszczenie-dpf-jelenia-gora",nazwa:"Jelenia G\xF3ra",wMiescie:"w Jeleniej G\xF3rze",zMiasta:"z Jeleniej G\xF3ry",km:55,min:55,trasa:"drog\u0105 krajow\u0105 nr 30 przez Gryf\xF3w \u015Al\u0105ski",lokalnie:"W Jeleniej G\xF3rze i Kotlinie Jeleniog\xF3rskiej auta je\u017Cd\u017C\u0105 po stromych drogach i kr\xF3tkich odcinkach miejskich, a zim\u0105 d\u0142ugo pracuj\u0105 na zimnym silniku. To trudne warunki dla filtra DPF, kt\xF3ry potrzebuje d\u0142u\u017Cszej, r\xF3wnej jazdy, \u017Ceby si\u0119 wypali\u0107.",dla:"Warsztatom z Jeleniej G\xF3ry, kt\xF3re nie maj\u0105 w\u0142asnej maszyny do czyszczenia DPF, proponujemy sta\u0142\u0105 wsp\xF3\u0142prac\u0119 i odbi\xF3r filtr\xF3w kurierem.",faq:[{q:"Jak wys\u0142a\u0107 filtr z Jeleniej G\xF3ry?",a:"Zam\xF3w odbi\xF3r przez formularz. Kurier odbierze filtr z domu lub z warsztatu, a po czyszczeniu odwiezie go pod ten sam adres."},{q:"Ile trwa ca\u0142o\u015B\u0107 przy wysy\u0142ce kurierem?",a:`Czyszczenie trwa ${z.czasRealizacji}, do tego transport w obie strony. Zwykle filtr wraca w ci\u0105gu 2\u20133 dni roboczych.`}]}],br=["Lw\xF3wek \u015Al\u0105ski","\u015Awierad\xF3w-Zdr\xF3j","Gryf\xF3w \u015Al\u0105ski"],zd=["Objawy i kody b\u0142\u0119d\xF3w","Czyszczenie czy wymiana","Eksploatacja i zapobieganie","Ci\u0119\u017Carowe i maszyny"],ct=[{slug:"objawy-zapchanego-filtra-dpf",foto:"media/dpf-zapchany.jpg",tytul:"Objawy zapchanego filtra DPF: 6 sygna\u0142\xF3w, kt\xF3rych nie warto ignorowa\u0107",kategoria:"Objawy i kody b\u0142\u0119d\xF3w",czas:6,lead:"Zapchany filtr DPF rzadko psuje si\u0119 z dnia na dzie\u0144. Zwykle wcze\u015Bniej daje kilka sygna\u0142\xF3w, kt\xF3re \u0142atwo zrzuci\u0107 na pogod\u0119 albo gorsze paliwo. Im wcze\u015Bniej je zauwa\u017Cysz, tym wi\u0119ksza szansa, \u017Ce wystarczy czyszczenie zamiast nowego filtra.",uslugi:["czyszczenie-dpf-fap"],sekcje:[{h:"Dlaczego filtr DPF si\u0119 zapycha",p:["Filtr cz\u0105stek sta\u0142ych zatrzymuje sadz\u0119 ze spalin. Podczas d\u0142u\u017Cszej jazdy ze sta\u0142\u0105 pr\u0119dko\u015Bci\u0105 sterownik podnosi temperatur\u0119 spalin i sadza si\u0119 wypala. Przy kr\xF3tkich trasach wypalanie nie ma szans si\u0119 zako\u0144czy\u0107.","Opr\xF3cz sadzy w filtrze zbiera si\u0119 popi\xF3\u0142 z dodatk\xF3w w oleju. Popio\u0142u nie da si\u0119 wypali\u0107, dlatego nawet w aucie je\u017Cd\u017C\u0105cym w trasie filtr po latach traci dro\u017Cno\u015B\u0107."]},{h:"1. Kontrolka DPF lub komunikat o filtrze",p:["To najcz\u0119stszy i najbardziej oczywisty sygna\u0142. Sterownik widzi za du\u017Ce przeciwci\u015Bnienie i prosi o jazd\u0119, kt\xF3ra pozwoli wypali\u0107 filtr. Je\u015Bli kontrolka wraca co kilka dni, sama jazda tras\u0105 ju\u017C nie pomo\u017Ce."]},{h:"2. Tryb awaryjny",p:["Auto nagle traci moc i nie wkr\u0119ca si\u0119 powy\u017Cej 2500\u20133000 obr./min. Sterownik ogranicza silnik, \u017Ceby nie dosz\u0142o do przegrzania lub uszkodzenia turbospr\u0119\u017Carki. To moment, w kt\xF3rym warto przesta\u0107 je\u017Adzi\u0107 i zbada\u0107 filtr."]},{h:"3. Spadek mocy bez komunikatu",p:["Zanim pojawi si\u0119 kontrolka, cz\u0119sto spada dynamika. Auto gorzej przyspiesza pod g\xF3r\u0119 i z obci\u0105\u017Ceniem. Wielu kierowc\xF3w zauwa\u017Ca to dopiero przy wyprzedzaniu."]},{h:"4. Wi\u0119ksze spalanie",p:["Zapchany filtr d\u0142awi wydech, a sterownik cz\u0119\u015Bciej uruchamia wypalanie, kt\xF3re samo zu\u017Cywa dodatkowe paliwo. Wzrost spalania o litr na sto kilometr\xF3w bez innej przyczyny to sygna\u0142 ostrzegawczy."]},{h:"5. Przerywane wypalanie",p:["Wentylator ch\u0142odnicy pracuje po zgaszeniu silnika, obroty biegu ja\u0142owego s\u0105 podniesione, czu\u0107 charakterystyczny zapach z wydechu. Je\u015Bli wy\u0142\u0105czasz auto w trakcie wypalania, proces zaczyna si\u0119 od nowa."]},{h:"6. Ro\u015Bnie poziom oleju",p:["Podczas wypalania cz\u0119\u015B\u0107 paliwa trafia do oleju silnikowego. Przy cz\u0119stych, przerywanych wypalaniach olej si\u0119 rozrzedza, a jego poziom na bagnecie ro\u015Bnie. To gro\u017Ane dla silnika, wi\u0119c nie ignoruj tego objawu."]},{h:"Co zrobi\u0107, gdy widzisz te objawy",p:["Najpierw sprawd\u017A, czy przyczyn\u0105 nie jest inna usterka: niesprawne wtryskiwacze, turbo podaj\u0105ce olej lub zaci\u0119ty EGR. Potem zbadaj przeciwci\u015Bnienie filtra. Je\u015Bli wk\u0142ad jest ca\u0142y, czyszczenie przywraca dro\u017Cno\u015B\u0107 za u\u0142amek ceny nowego filtra."]}]},{slug:"czyszczenie-czy-wymiana-dpf",foto:"media/przekroj-2.jpg",tytul:"Czyszczenie, wypalanie czy nowy DPF? Por\xF3wnanie koszt\xF3w i skuteczno\u015Bci",kategoria:"Czyszczenie czy wymiana",czas:5,lead:"Gdy filtr DPF si\u0119 zapcha, masz kilka dr\xF3g wyj\u015Bcia. R\xF3\u017Cni\u0105 si\u0119 kosztem, skuteczno\u015Bci\u0105 i tym, jak d\u0142ugo spok\xF3j potrwa. Zestawiamy je obok siebie, \u0142\u0105cznie z opcj\u0105, kt\xF3rej nie polecamy.",uslugi:["czyszczenie-dpf-fap"],porownanie:!0,sekcje:[{h:"Wypalanie serwisowe",p:["Warsztat wymusza wypalanie komputerem diagnostycznym. Usuwa cz\u0119\u015B\u0107 sadzy, ale nie usuwa popio\u0142u. Pomaga, gdy filtr jest zapchany niedawno i g\u0142\xF3wnie sadz\u0105. Przy filtrze z du\u017Cym przebiegiem efekt bywa kr\xF3tkotrwa\u0142y."]},{h:"Czyszczenie hydrodynamiczne",p:["Filtr jest wymontowany i p\u0142ukany na maszynie, kt\xF3ra usuwa zar\xF3wno sadz\u0119, jak i popi\xF3\u0142. Przeciwci\u015Bnienie mierzymy przed i po, wi\u0119c efekt jest udokumentowany. To rozwi\u0105zanie dla filtr\xF3w z ca\u0142ym wk\u0142adem."]},{h:"Nowy filtr",p:["Najdro\u017Csza opcja, zwykle kilka tysi\u0119cy z\u0142otych za orygina\u0142. Ma sens, gdy wk\u0142ad jest p\u0119kni\u0119ty lub stopiony. Tanie zamienniki bywaj\u0105 nietrwa\u0142e, warto sprawdza\u0107 ich homologacj\u0119."]},{h:"Wyci\u0119cie filtra",p:["Tej us\u0142ugi nie wykonujemy. Usuni\u0119cie DPF jest niezgodne z przepisami, grozi niezaliczonym przegl\u0105dem i kar\u0105 przy kontroli drogowej, a auto po wyci\u0119ciu trudniej sprzeda\u0107."]},{h:"Co wybra\u0107",p:["Je\u015Bli filtr ma ca\u0142y wk\u0142ad, a przyczyna zapchania zosta\u0142a usuni\u0119ta, czyszczenie daje efekt zbli\u017Cony do nowego filtra przy znacznie ni\u017Cszym koszcie. Je\u015Bli nie wiesz, w jakim stanie jest filtr, zbadamy go przed czyszczeniem i powiemy wprost."]}]},{slug:"dlaczego-dpf-sie-zapycha",foto:"media/dym.jpg",tytul:"Dlaczego DPF si\u0119 zapycha i jak temu zapobiec",kategoria:"Eksploatacja i zapobieganie",czas:5,lead:"Czyszczenie przywraca filtrowi dro\u017Cno\u015B\u0107, ale je\u015Bli przyczyna zostanie w aucie, filtr zapcha si\u0119 ponownie. Oto najcz\u0119stsze powody i to, co mo\u017Cesz zrobi\u0107 na co dzie\u0144.",uslugi:["czyszczenie-dpf-fap","czyszczenie-scr"],sekcje:[{h:"Kr\xF3tkie trasy",p:["Filtr potrzebuje kilkunastu minut jazdy z r\xF3wn\u0105 pr\u0119dko\u015Bci\u0105, \u017Ceby si\u0119 wypali\u0107. Je\u015Bli auto je\u017Adzi g\u0142\xF3wnie po mie\u015Bcie, raz na tydzie\u0144 lub dwa zr\xF3b d\u0142u\u017Csz\u0105 tras\u0119 drog\u0105 szybkiego ruchu."]},{h:"Niesprawne wtryskiwacze",p:["Lej\u0105ce wtryskiwacze produkuj\u0105 wi\u0119cej sadzy, ni\u017C filtr jest w stanie wypali\u0107. Przed czyszczeniem warto sprawdzi\u0107 korekty wtrysk\xF3w, inaczej efekt potrwa kr\xF3tko."]},{h:"Turbospr\u0119\u017Carka i odma",p:["Olej przedostaj\u0105cy si\u0119 do uk\u0142adu wydechowego zalepia kana\u0142y filtra i zamienia si\u0119 w popi\xF3\u0142. \u015Alady oleju na wlocie filtra to sygna\u0142, \u017Ceby sprawdzi\u0107 turbo."]},{h:"Zaw\xF3r EGR",p:["Zaci\u0119ty zaw\xF3r EGR zaburza spalanie i zwi\u0119ksza ilo\u015B\u0107 sadzy. Jego czyszczenie lub naprawa cz\u0119sto idzie w parze z czyszczeniem DPF."]},{h:"Niew\u0142a\u015Bciwy olej",p:["Do aut z DPF stosuj olej o niskiej zawarto\u015Bci popio\u0142\xF3w siarczanowych (normy low SAPS, np. ACEA C3). Zwyk\u0142y olej szybciej zape\u0142nia filtr popio\u0142em."]},{h:"Przerywane wypalanie",p:["Je\u015Bli s\u0142yszysz wentylator po zgaszeniu silnika lub widzisz podniesione obroty, pozw\xF3l autu doko\u0144czy\u0107 wypalanie. Ka\u017Cde przerwanie oznacza start od nowa i wi\u0119cej paliwa w oleju."]}]}],jl={kolumny:["Wypalanie serwisowe","Czyszczenie hydrodynamiczne","Nowy filtr","Wyci\u0119cie DPF"],wiersze:[{cecha:"Koszt",w:["niski","\u015Bredni","wysoki, kilka tys. z\u0142","niski, ale z ryzykiem kar"]},{cecha:"Usuwa sadz\u0119",w:["cz\u0119\u015Bciowo","tak","nie dotyczy","nie dotyczy"]},{cecha:"Usuwa popi\xF3\u0142",w:["nie","tak","nie dotyczy","nie dotyczy"]},{cecha:"Udokumentowany efekt",w:["nie","tak, wydruk przed/po","tak","nie"]},{cecha:"Zgodne z przepisami",w:["tak","tak","tak","nie"]},{cecha:"Przegl\u0105d techniczny",w:["bez problemu","bez problemu","bez problemu","ryzyko negatywnego wyniku"]}]},gd=[{plik:"dpf-zapchany.jpg",tytul:"DPF vor Reinigung",autor:"Michael KR",licencja:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:DPF_vor_Reinigung.JPG",zmiany:"przyci\u0119te"},{plik:"dpf-czysty.jpg",tytul:"DPF nach Reinigung",autor:"Michael KR",licencja:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:DPF_nach_Reinigung.JPG",zmiany:"przyci\u0119te"},{plik:"dpf-czolo.jpg",tytul:"Siliziumkarbid-Partikelfilter",autor:"Michael Kairo",licencja:"domena publiczna",url:"https://commons.wikimedia.org/wiki/File:Siliziumkarbid-Partikelfilter.jpg"},{plik:"katalizator.jpg",tytul:"DPF Sensoren Oxikat",autor:"Michael KR",licencja:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:DPF_Sensoren_Oxikat_039.JPG"},{plik:"scr.jpg",tytul:"Hino Standardized SCR Unit",autor:"z22",licencja:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Hino_Standardized_SCR_Unit.jpg"},{plik:"wydech.jpg",tytul:"FAP-Filter Peugeot",autor:"Wikimedia Commons",licencja:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:FAP-Filter_Peugeot.jpg"},{plik:"wklady.jpg",tytul:"DPF Siliziumkarbid",autor:"Michael KR",licencja:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:DPF_Siliziumkarbid.JPG"},{plik:"przekroj.jpg",tytul:"Diesel particulate filter 01",autor:"Hatsukari715",licencja:"domena publiczna",url:"https://commons.wikimedia.org/wiki/File:Diesel_particulate_filter_01.JPG"},{plik:"przekroj-2.jpg",tytul:"Russfilter cutout EMS",autor:"Wikimedia Commons",licencja:"CC BY-SA 3.0",url:"https://commons.wikimedia.org/wiki/File:Russfilter_cutout_EMS.jpg"},{plik:"dpf-lkw.jpg",tytul:"HJS Sintermetallfilter LKW Variante",autor:"Michael KR",licencja:"CC BY-SA 4.0",url:"https://commons.wikimedia.org/wiki/File:HJS_Sintermetallfilter_LKW_Variante.jpg"},{plik:"hero-mechanik.mp4",tytul:"An auto mechanic inspecting the undercarriage of a vehicle",a
